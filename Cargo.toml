[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/mail", "crates/storage", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/pratham-projects/deskpost"
publish = false

[workspace.dependencies]
dp-core = { path = "crates/core" }
dp-db = { path = "crates/db" }
dp-mail = { path = "crates/mail" }
dp-storage = { path = "crates/storage" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
