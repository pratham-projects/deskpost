[package]
name = "dp-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# In-process fake SMTP/IMAP servers for tests of this and dependent crates.
testing = []

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
