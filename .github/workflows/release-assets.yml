name: release-assets
# Attach deploy files to a GitHub release.
# Releases created by GITHUB_TOKEN (cargo-dist) do not fire `release: published`,
# so also run after the Release workflow finishes. Manual run: pass a tag.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  upload:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.event.workflow_run.head_sha }}
      - name: Upload assets
        run: |
          case "$TAG" in v*) ;; *) echo "not a release tag: $TAG"; exit 0 ;; esac
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            docker-compose.yml \
            .env.example \
            deploy/Caddyfile \
            deploy/web.Caddyfile \
            deploy/deskpost-api.service
